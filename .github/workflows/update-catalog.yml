name: Actualiser le catalogue Deadpool VF
on:
  schedule:
    - cron: '23 22 * * *'
      timezone: 'Europe/Paris'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-catalog.yml'
      - 'scripts/update_catalog.py'
      - 'scripts/sync_bnf.py'
      - 'index.html'
      - 'data/merchant-offers.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deadpool-catalogue
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Découvrir les notices Deadpool dans le catalogue BnF
        run: python scripts/sync_bnf.py
      - name: Vérifier les métadonnées et les offres autorisées
        run: python scripts/update_catalog.py
      - name: Publier les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-status.json data/bnf-deadpool.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour quotidienne du catalogue"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Une modification concurrente est arrivée ; nouvelle tentative $attempt/5."
              sleep 3
            done
            echo "Impossible de publier après 5 tentatives."
            exit 1
          fi
