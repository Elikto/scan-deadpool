name: Actualiser le catalogue Deadpool VF
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deadpool-catalogue
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les métadonnées et les offres autorisées
        run: python scripts/update_catalog.py
      - name: Publier les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour quotidienne du catalogue"
            git push
          fi
