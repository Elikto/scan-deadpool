name: Synchroniser les notices bibliographiques
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync.py'
      - 'scripts/bedetheque_covers.py'
      - 'scripts/bnf_covers.py'
      - 'data/bedetheque-matches.json'
      - '.github/workflows/catalog.yml'
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier et synchroniser les notices
        run: python scripts/sync.py
      - name: Récupérer les couvertures officielles BnF
        run: python scripts/bnf_covers.py
      - name: Associer les couvertures Bédéthèque vérifiées
        run: python scripts/bedetheque_covers.py
      - name: Enregistrer les données si elles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser les notices BnF et couvertures vérifiées"
            git push
          fi
